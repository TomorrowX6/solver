<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Turnstile Solver</title>
<style>
  :root {
    --bg: #f7f8fa; --card: #ffffff; --border: rgba(28, 31, 35, .08);
    --fill: rgba(46, 50, 56, .05); --fill-hover: rgba(46, 50, 56, .09);
    --text: #1c1f23; --text2: rgba(28, 31, 35, .62); --text3: rgba(28, 31, 35, .35);
    --primary: #0064fa; --primary-hover: #0062d6; --primary-light: #eaf5ff;
    --green: #3bb346; --green-light: #ecf7ec; --orange: #fc8800; --orange-light: #fff8ea;
    --red: #f93920; --red-light: #fef2ed; --cyan: #05a4b6; --cyan-light: #e5f7f8;
    --violet: #6a3ac7; --violet-light: #f3edf9;
    --shadow: 0 0 1px rgba(0, 0, 0, .1), 0 2px 8px rgba(0, 0, 0, .04);
    --mask: rgba(22, 22, 26, .45);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16161a; --card: #232429; --border: rgba(255, 255, 255, .08);
      --fill: rgba(255, 255, 255, .06); --fill-hover: rgba(255, 255, 255, .1);
      --text: #f9f9f9; --text2: rgba(249, 249, 249, .6); --text3: rgba(249, 249, 249, .35);
      --primary: #54a9ff; --primary-hover: #7fc1ff; --primary-light: rgba(84, 169, 255, .16);
      --green: #5dc264; --green-light: rgba(93, 194, 100, .16); --orange: #ffae43; --orange-light: rgba(255, 174, 67, .16);
      --red: #fc725a; --red-light: rgba(252, 114, 90, .16); --cyan: #4cc3d0; --cyan-light: rgba(76, 195, 208, .16);
      --violet: #a481e2; --violet-light: rgba(164, 129, 226, .16);
      --shadow: none; --mask: rgba(0, 0, 0, .6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16161a; --card: #232429; --border: rgba(255, 255, 255, .08);
    --fill: rgba(255, 255, 255, .06); --fill-hover: rgba(255, 255, 255, .1);
    --text: #f9f9f9; --text2: rgba(249, 249, 249, .6); --text3: rgba(249, 249, 249, .35);
    --primary: #54a9ff; --primary-hover: #7fc1ff; --primary-light: rgba(84, 169, 255, .16);
    --green: #5dc264; --green-light: rgba(93, 194, 100, .16); --orange: #ffae43; --orange-light: rgba(255, 174, 67, .16);
    --red: #fc725a; --red-light: rgba(252, 114, 90, .16); --cyan: #4cc3d0; --cyan-light: rgba(76, 195, 208, .16);
    --violet: #a481e2; --violet-light: rgba(164, 129, 226, .16);
    --shadow: none; --mask: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5715 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  h1, h2, h3 { margin: 0; font-weight: 600; }
  button, input, select, textarea { font: inherit; color: inherit; }
  svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
  .t2 { color: var(--text2); }
  .t3 { color: var(--text3); }
  [hidden] { display: none !important; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
    height: 32px; padding: 0 12px; border-radius: 6px; border: 0; cursor: pointer;
    background: var(--fill); color: var(--text); font-weight: 600;
  }
  .btn:hover { background: var(--fill-hover); }
  .btn.primary { background: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-hover); }
  .btn.danger { background: var(--red-light); color: var(--red); }
  .btn.link { background: transparent; color: var(--primary); padding: 0 6px; height: 26px; }
  .btn.link:hover { background: var(--primary-light); }
  .btn.link.danger { color: var(--red); }
  .btn.link.danger:hover { background: var(--red-light); }
  .btn.icon { width: 32px; padding: 0; background: transparent; color: var(--text2); }
  .btn.icon:hover { background: var(--fill); color: var(--text); }
  .btn.sm { height: 26px; padding: 0 8px; font-size: 12.5px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .input, .select, textarea.input {
    height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid transparent;
    background: var(--fill); outline: none; min-width: 0;
  }
  textarea.input { height: auto; padding: 8px 12px; resize: vertical; }
  .input:hover, .select:hover { background: var(--fill-hover); }
  .input:focus, .select:focus { border-color: var(--primary); background: var(--card); }
  .btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
  .switch { position: relative; width: 40px; height: 22px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch span { position: absolute; inset: 0; border-radius: 11px; background: var(--fill-hover); cursor: pointer; transition: background .2s; }
  .switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .switch input:checked + span { background: var(--primary); }
  .switch input:checked + span::after { transform: translateX(18px); }

  .tag {
    display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px;
    border-radius: 11px; font-size: 12px; font-weight: 600; white-space: nowrap;
    background: var(--fill); color: var(--text2);
  }
  .tag.green { background: var(--green-light); color: var(--green); }
  .tag.orange { background: var(--orange-light); color: var(--orange); }
  .tag.red { background: var(--red-light); color: var(--red); }
  .tag.blue { background: var(--primary-light); color: var(--primary); }
  .tag.cyan { background: var(--cyan-light); color: var(--cyan); }
  .tag.violet { background: var(--violet-light); color: var(--violet); }
  .tag .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .hdr {
    position: sticky; top: 0; z-index: 20; height: 56px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 0 16px; background: var(--card); border-bottom: 1px solid var(--border);
  }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; white-space: nowrap; min-width: 0; }
  .logo-mark { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--primary); color: #fff; flex: none; }
  .hdr-right { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .user-chip { display: flex; align-items: center; gap: 8px; padding: 0 6px 0 4px; height: 32px; border-radius: 16px; background: var(--fill); }
  .avatar-sm { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--primary); color: #fff; font-size: 12px; font-weight: 700; text-transform: uppercase; }

  /* 控制台外壳固定在窗口内,页面本身不滚动,只有侧栏和内容区各自滚动 */
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #app .hdr { position: static; flex: none; }
  .layout { display: flex; flex: 1; min-height: 0; }
  .side {
    width: 200px; flex: none; padding: 8px; background: var(--card); border-right: 1px solid var(--border);
    overflow-y: auto;
  }
  .side-group { font-size: 12px; color: var(--text3); padding: 12px 12px 4px; }
  .nav { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 12px; margin-bottom: 2px;
    border-radius: 8px; color: var(--text2); text-decoration: none; font-weight: 600; white-space: nowrap; }
  .nav:hover { background: var(--fill); color: var(--text); }
  .nav.active { background: var(--primary-light); color: var(--primary); }
  .content { flex: 1; min-width: 0; padding: 20px 24px 32px; overflow-y: auto; }
  .page { display: grid; gap: 16px; max-width: 1400px; grid-template-columns: minmax(0, 1fr); }
  .page-hd { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .page-hd h2 { font-size: 18px; }

  .card { background: var(--card); border-radius: 12px; box-shadow: var(--shadow); border: 1px solid var(--border); min-width: 0; }
  .card-hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 14px 16px 0; }
  .card-hd h3 { font-size: 14px; }
  .card-bd { padding: 14px 16px 16px; }

  .groups { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  .group h3 { font-size: 14px; margin-bottom: 12px; }
  .metric { display: flex; align-items: center; gap: 12px; }
  .metric + .metric { margin-top: 12px; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; color: #fff; }
  .avatar svg.i { width: 18px; height: 18px; }
  .av-blue { background: var(--primary); } .av-green { background: var(--green); } .av-orange { background: var(--orange); }
  .av-red { background: var(--red); } .av-cyan { background: var(--cyan); } .av-violet { background: var(--violet); }
  .metric .label { font-size: 12px; color: var(--text2); }
  .metric .value { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.3; }
  .dash-row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .chart svg { display: block; width: 100%; height: 240px; }
  .chart .axis { fill: var(--text3); font-size: 11px; }
  .chart .grid { stroke: var(--border); stroke-width: 1; }
  .legend { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--text2); }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: 1px; }
  .seg { display: inline-flex; background: var(--fill); border-radius: 6px; padding: 2px; }
  .seg button { border: 0; background: transparent; height: 26px; padding: 0 12px; border-radius: 5px; cursor: pointer; color: var(--text2); font-weight: 600; }
  .seg button.active { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .list { display: grid; gap: 2px; grid-template-columns: minmax(0, 1fr); }
  .list-row { display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-radius: 8px; }
  .list-row:hover { background: var(--fill); }
  .list-row .grow { flex: 1; min-width: 0; }
  .list-row .sub { font-size: 12px; color: var(--text3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list-more { display: flex; align-items: center; justify-content: center; gap: 4px; padding: 8px; border: 0; border-radius: 8px; background: none; color: var(--text2); font-size: 12px; cursor: pointer; }
  .list-more:hover { background: var(--fill); color: var(--text); }
  .list-more .i { width: 14px; height: 14px; transition: transform .2s; }
  .list-more.open .i { transform: rotate(180deg); }
  .slot-badge { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; flex: none; background: var(--fill); font-weight: 700; text-transform: uppercase; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; align-items: center; }
  .kv dt { color: var(--text2); }
  .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .toolbar .input { width: 200px; }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { text-align: left; padding: 11px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; vertical-align: middle; }
  th { color: var(--text2); font-weight: 600; font-size: 13px; }
  tbody tr:hover td { background: var(--fill); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.wrap { white-space: normal; min-width: 180px; max-width: 420px; }
  .ops { display: flex; gap: 2px; }
  .empty { text-align: center; color: var(--text3); padding: 40px 16px; }
  .err-text { color: var(--red); font-size: 12.5px; }
  .pos { color: var(--green); } .neg { color: var(--red); }
  .pager { display: flex; justify-content: flex-end; align-items: center; gap: 4px; padding: 12px 16px; flex-wrap: wrap; }
  .pager .t2 { margin-right: 8px; font-size: 13px; }
  .pg { min-width: 28px; height: 28px; padding: 0 6px; border: 0; border-radius: 6px; background: transparent; color: var(--text2); cursor: pointer; }
  .pg:hover { background: var(--fill); }
  .pg.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
  .pg:disabled { opacity: .4; cursor: default; background: transparent; }
  .bar { height: 6px; width: 64px; border-radius: 3px; background: var(--fill); overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 8px; }
  .bar > span { display: block; height: 100%; background: var(--primary); }
  .key-cell { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; }
  .key-cell > .mono { min-width: 0; overflow-wrap: anywhere; } /* 回调地址等长 URL 在窄屏上折行 */

  /* 单列 grid 的列宽默认按最长的不换行内容撑开(手机上会超出卡片),统一限制为容器宽度 */
  .form { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
  .field { display: grid; gap: 6px; font-weight: 600; font-size: 13px; grid-template-columns: minmax(0, 1fr); }
  .field .input, .field .select { width: 100%; font-weight: 400; }
  .field-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 600; font-size: 13px; }
  .hint { font-weight: 400; font-size: 12px; color: var(--text3); }
  .toggles { display: flex; flex-wrap: wrap; gap: 8px 24px; font-weight: 400; }
  .toggles > span { display: inline-flex; align-items: center; gap: 8px; }
  .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .stack { display: grid; gap: 16px; align-content: start; grid-template-columns: minmax(0, 1fr); }
  .token-box { word-break: break-all; background: var(--fill); border-radius: 8px; padding: 12px; max-height: 220px; overflow: auto; }
  .big-num { font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; }

  .modal-mask { position: fixed; inset: 0; background: var(--mask); z-index: 50; display: grid; place-items: center; padding: 16px; }
  .modal { width: 100%; max-width: 460px; max-height: calc(100vh - 32px); overflow: auto; background: var(--card); border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,.2); }
  .modal-hd { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px 0; }
  .modal-hd h3 { font-size: 16px; }
  .modal-bd { padding: 16px 20px; }
  .modal-ft { display: flex; justify-content: flex-end; gap: 8px; padding: 0 20px 18px; }
  .toasts { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 60; display: grid; gap: 8px; justify-items: center; pointer-events: none; }
  .toast { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 8px; background: var(--card); box-shadow: 0 4px 16px rgba(0,0,0,.12); border: 1px solid var(--border); font-weight: 600; }
  .toast .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
  .toast.err .dot { background: var(--red); }

  .auth-wrap { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .auth { width: 100%; max-width: 400px; padding: 32px 28px; }
  .auth .logo { justify-content: center; font-size: 20px; margin-bottom: 8px; }
  .auth .sub-title { text-align: center; color: var(--text2); margin-bottom: 20px; }
  .auth .input, .auth .btn { height: 40px; width: 100%; }
  .auth .switch-line { text-align: center; font-size: 13px; color: var(--text2); }
  .auth .switch-line a { color: var(--primary); cursor: pointer; text-decoration: none; }
  .auth .divider { display: flex; align-items: center; gap: 10px; color: var(--text3); font-size: 12px; }
  .auth .divider::before, .auth .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  a.btn { text-decoration: none; }

  .doc h3 { font-size: 15px; margin-bottom: 10px; }
  .doc p { margin: 10px 0 8px; color: var(--text2); }
  .doc .table-wrap { margin: 4px -16px 0; }
  .doc > .table-wrap:last-child { margin-bottom: -16px; }
  #pub .doc { scroll-margin-top: 72px; }
  #app .doc { scroll-margin-top: 16px; }
  .api-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .code { position: relative; }
  .code pre {
    margin: 0; padding: 12px 44px 12px 14px; background: var(--fill); border-radius: 8px; overflow-x: auto;
    font: 12.5px/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .code .copy { position: absolute; top: 6px; right: 6px; }
  .pub-main { max-width: 980px; margin: 0 auto; padding: 20px 16px 40px; }

  @media (max-width: 1100px) {
    .groups { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .dash-row, .two { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 720px) {
    .layout { flex-direction: column; }
    .side {
      flex: none; width: auto; padding: 6px 8px;
      display: flex; gap: 4px; overflow-x: auto; overflow-y: hidden; border-right: 0; border-bottom: 1px solid var(--border);
    }
    .side-group { display: none; }
    .nav { margin: 0; height: 34px; flex: none; }
    .content { padding: 16px; }
    .groups { grid-template-columns: minmax(0, 1fr); }
    .logo-text, .user-chip .name { display: none; }
    .toolbar .input { width: 100%; }
  }
</style>
</head>
<body>

<div class="auth-wrap" id="auth" hidden>
  <div class="card auth">
    <div class="logo"><span class="logo-mark" data-icon="shield"></span><span class="sys-name">Turnstile Solver</span></div>
    <div class="sub-title" id="auth-title">登录</div>
    <form class="form" id="auth-form">
      <input class="input" id="a-user" autocomplete="username" placeholder="用户名" required>
      <input class="input" id="a-pass" type="password" autocomplete="current-password" placeholder="密码" required>
      <input class="input" id="a-key" type="password" autocomplete="off" placeholder="现有的 API Key" hidden>
      <button class="btn primary" type="submit" id="a-submit">登录</button>
      <div class="divider" id="a-or" hidden>或</div>
      <a class="btn" id="a-github" href="/api/oauth/github" hidden><span data-icon="github"></span>使用 GitHub 登录</a>
      <a class="btn" id="a-linuxdo" href="/api/oauth/linuxdo" hidden><span data-icon="linuxdo"></span>使用 LINUX DO 登录</a>
      <div class="switch-line" id="a-switch"></div>
      <div class="switch-line"><a href="#docs">使用文档</a></div>
    </form>
  </div>
</div>

<div id="pub" hidden>
  <header class="hdr">
    <div class="logo"><span class="logo-mark" data-icon="shield"></span><span class="sys-name">Turnstile Solver</span></div>
    <a class="btn primary" href="#">登录</a>
  </header>
  <main class="pub-main" id="pub-content"></main>
</div>

<div id="app" hidden>
  <header class="hdr">
    <div class="logo"><span class="logo-mark" data-icon="shield"></span><span class="logo-text sys-name">Turnstile Solver</span></div>
    <div class="hdr-right">
      <button class="btn icon" id="theme" type="button" title="主题"></button>
      <div class="user-chip"><span class="avatar-sm" id="me-avatar"></span><span class="name" id="me-name"></span></div>
      <button class="btn icon" id="logout" type="button" title="退出" data-icon="logout"></button>
    </div>
  </header>
  <div class="layout">
    <nav class="side" id="side"></nav>
    <main class="content" id="content"></main>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const SVGNS = "http://www.w3.org/2000/svg";
  const ROLE = { USER: 1, ADMIN: 10, ROOT: 100 };
  const ROLE_TAG = { 1: ["普通用户", ""], 10: ["管理员", "orange"], 100: ["超级管理员", "violet"] };
  const LOG_TYPES = { 1: ["充值", "cyan"], 2: ["消费", "green"], 3: ["管理", "orange"], 4: ["系统", "violet"], 5: ["错误", "red"] };
  const REDEEM_STATUS = { 1: ["未使用", "green"], 2: ["已禁用", ""], 3: ["已使用", "blue"] };
  const PAGE_SIZE = 20;

  // ---------------------------------------------------------------- 工具
  function h(tag, attrs, ...children) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "style") el.style.cssText = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (k === "value") el.value = v;
      else if (k === "checked") el.checked = Boolean(v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const c of children.flat()) {
      if (c == null || c === false) continue;
      el.append(c instanceof Node ? c : String(c));
    }
    return el;
  }
  function svg(tag, attrs, ...children) {
    const el = document.createElementNS(SVGNS, tag);
    for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
    for (const c of children.flat()) if (c != null) el.append(c instanceof Node ? c : String(c));
    return el;

    const plotH = Hh - top - bottom;

          metric("orange", "clock", "平均耗时", d.day.elapsed == null ? "—" : `${Number(d.day.elapsed).toFixed(1)}s`)));
      const byHour = new Map(d.hourly.map(([hh, ok, fail]) => [hh, { ok, fail }]));
      const end = Math.floor(Date.now() / 3600000) * 3600;
      const buckets = [];
      for (let i = 23; i >= 0; i--) {
        const hh = end - i * 3600;
        const b = byHour.get(hh) || { ok: 0, fail: 0 };
        buckets.push({ t: hh, ok: b.ok, fail: b.fail });
      }
      chart.replaceChildren(barChart(buckets, { label: (b) => clock(b.t) }));

    // 运行中的渠道直接显示(最多 4 个),未运行、禁用与多出的折叠
    const renderSide = () => {
      const slots = Object.entries(sideFleet.slots);
      const up = slots.filter(([, s]) => s && !s.error && !s.disabled);
      const active = up.reduce((n, [, s]) => n + ((s.health && s.health.active) || 0), 0);
      const capacity = up.reduce((n, [, s]) => n + ((s.health && s.health.capacity) || 0), 0);
      sideMeta.textContent = `${up.length} / ${slots.length} 在线 · ${active} / ${capacity} 并发`;
      const row = ([slot, s]) => {
        const st = s && s.disabled ? { color: "", text: "已禁用" } : workerState(s);
        const hl = s && s.health;
        return h("div", { class: "list-row" },
          h("div", { class: "slot-badge" }, slot),
          h("div", { class: "grow" }, h("div", {}, hl ? `${hl.active} / ${hl.capacity} 并发` : (s && s.name) || "—"),
            h("div", { class: "sub mono" }, hl && hl.worker ? hl.worker.split("/")[0] : (s && s.error) || "—")),
          s && !s.error ? latencyTag(s.latency) : null,
          dotTag(st.text, st.color));
      };
      const shown = up.slice(0, 4);
      const folded = slots.filter((x) => !shown.includes(x));
      const rows = [...shown.map(row), ...(sideOpen ? folded.map(row) : [])];
      if (!rows.length) rows.push(h("div", { class: "list-row" }, h("div", { class: "grow sub" }, "暂无在线渠道")));
      if (folded.length) rows.push(h("button", { type: "button", class: `list-more${sideOpen ? " open" : ""}`,
        onclick: () => { sideOpen = !sideOpen; renderSide(); } }, sideOpen ? "收起" : `展开其余 ${folded.length} 个`, icon("chevron")));
      sideCard.replaceChildren(...rows);
    };
    await Promise.all([load(), loadSide()]);
    every(30, () => Promise.all([load(), loadSide()]));
  }

  async function pagePlayground(root) {
    const tokens = (await api("GET", "/api/token?p=1&size=100")).items.filter((t) => t.status === 1);
    const tokenSel = h("select", { class: "select" }, tokens.map((t) => h("option", { value: t.key }, t.name)));
    const url = h("input", { class: "input", type: "url", required: true });

    const action = h("input", { class: "input", maxlength: 32 });
    const submit = h("button", { class: "btn primary", type: "submit" }, "求解");
    const status = h("span");
    const out = h("div", { class: "card-bd form" }, h("div", { class: "empty", style: "padding:24px 0" }, "—"));
    const setStatus = (text, color) => status.replaceChildren(tag(text, color));
    const form = h("form", { class: "card-bd form" },
      tokens.length ? field("令牌", tokenSel) : h("div", { class: "err-text" }, "请先在「令牌」页创建令牌"),
      field("websiteURL", url), field("websiteKey", key), field("action", action), submit);
    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      if (!tokens.length) return;
      submit.disabled = true;
      out.replaceChildren();
      const started = Date.now();
      const post = async (path, body) => (await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })).json();
      try {
        const task = { type: "TurnstileTaskProxyless", websiteURL: url.value.trim(), websiteKey: key.value.trim() };
        if (action.value.trim()) task.metadata = { action: action.value.trim() };
        const created = await post("/createTask", { clientKey: tokenSel.value, task });
        if (created.errorId) { setStatus("失败", "red"); out.append(h("div", { class: "err-text" }, `${created.errorCode} ${created.errorDescription || ""}`)); return; }
        out.append(h("div", { class: "mono t2" }, `taskId ${created.taskId}`));
        setStatus("识别中", "blue");
        while (Date.now() - started < 150000) {
          await new Promise((r) => setTimeout(r, 3000));
          const res = await post("/getTaskResult", { clientKey: tokenSel.value, taskId: created.taskId });
          const secs = ((Date.now() - started) / 1000).toFixed(1);
          if (res.errorId) { setStatus(`${secs}s`, "red"); out.append(h("div", { class: "err-text" }, `${res.errorCode} ${res.errorDescription || ""}`)); return; }
          if (res.status === "ready") {
            setStatus(`${secs}s`, "green");
            const token = (res.solution && res.solution.token) || "";
            out.append(h("div", { class: "token-box mono" }, token), h("div", {}, h("button", { class: "btn", type: "button", onclick: () => copyText(token) }, icon("copy"), "复制")));
            return;
          }
          setStatus(`识别中 ${secs}s`, "blue");
        }
        setStatus("超时", "red");
      } catch (err) {
        setStatus("失败", "red");
        out.append(h("div", { class: "err-text" }, err.message));
      } finally {
        submit.disabled = false;
      }
    });
    root.append(pageHeader("操练场"), h("div", { class: "two" },
      h("div", { class: "card" }, h("div", { class: "card-hd" }, h("h3", {}, "任务"), tag("TurnstileTaskProxyless", "blue")), form),
      h("div", { class: "card" }, h("div", { class: "card-hd" }, h("h3", {}, "结果"), status), out)));
  }

  // ---------------------------------------------------------------- 渠道(worker)
  function workerState(s) {
    if (s && s.kind === "cnb" && s.error === "HTTP 530") return { color: "", text: "未运行" };
    if (!s || s.error) return { color: "red", text: "离线" };
    const phase = s.agent && s.agent.phase;
    if (phase === "draining" || phase === "drained") return { color: "orange", text: "下线中" };
    if (phase === "failed") return { color: "red", text: "失败" };
    if (phase === "starting") return { color: "orange", text: "启动中" };
    if (s.health && s.health.status === "ok") return { color: "green", text: "正常" };
    return { color: "orange", text: "降级" };
  }

    const load = async () => {
      const f = await api("GET", "/api/admin/fleet");
      const now = f.fetched_at;
      const minutes = new Map();
      const rows = Object.entries(f.slots).map(([slot, s]) => {
        const hl = s && !s.error && s.health;
        let cpu = null;
        if (hl && hl.cpu_seconds != null) {
          const prev = cpuSamples[slot];
          if (prev && prev.worker === hl.worker && now > prev.at) cpu = Math.max(0, Math.round(((hl.cpu_seconds - prev.cpu) / (now - prev.at) / (hl.cpu_limit || 1)) * 100));
          cpuSamples[slot] = { worker: hl.worker, cpu: hl.cpu_seconds, at: now };
        }
        for (const [m, ok, fail] of (s && s.minutes) || []) {
          const b = minutes.get(m) || { ok: 0, fail: 0 };
          b.ok += ok; b.fail += fail;
          minutes.set(m, b);
        }
        return { slot, s, hl, cpu };
      });
      card.replaceChildren(table([
        { title: "位置", render: (r) => h("div", { class: "slot-badge" }, r.slot) },

        { title: "成功", num: true, render: (r) => (r.hl ? num(r.hl.solved) : "—") },
        { title: "失败", num: true, render: (r) => (r.hl ? h("span", { class: r.hl.solve_failed ? "neg" : null }, num(r.hl.solve_failed)) : "—") },
        { title: "CPU", num: true, render: (r) => (r.cpu == null ? "—" : `${r.cpu}%`) },
        { title: "内存", num: true, render: (r) => (r.hl && r.hl.mem_used_mb != null ? `${(r.hl.mem_used_mb / 1024).toFixed(1)}G` : "—") },
        { title: "响应", render: (r) => (r.s && !r.s.error ? latencyTag(r.s.latency) : h("span", { class: "err-text" }, (r.s && r.s.error) || "—")) },
        { title: "失败尝试", wrap: true, render: (r) => {
          const reasons = Object.entries((r.hl && r.hl.attempt_errors) || {}).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]).slice(0, 3);
          return reasons.length ? h("div", { class: "toolbar", style: "gap:4px" }, reasons.map(([k, v]) => tag(`${shortReason(k)} ×${v}`, "orange", k))) : "—";
        } },
      ], rows));
      const end = Math.floor(now / 60) * 60;
      const buckets = [];
      for (let i = 59; i >= 0; i--) {
        const m = end - i * 60;
        const b = minutes.get(m) || { ok: 0, fail: 0 };
        buckets.push({ t: m, ok: b.ok, fail: b.fail });
      }
      chart.replaceChildren(barChart(buckets, { label: (b) => clock(b.t) }));
    };
    const loadServers = () => serverChannels(servers, async () => { await loadServers(); await load(); });
    await Promise.all([load(), loadServers()]);
    every(15, load);
  }

  // ---------------------------------------------------------------- 用户管理
  function userModal(user, onSaved) {
    const username = h("input", { class: "input", value: user ? user.username : "", disabled: Boolean(user), autocomplete: "off" });
    const password = h("input", { class: "input", type: "password", autocomplete: "new-password", placeholder: user ? "不修改请留空" : "" });
    const quota = h("input", { class: "input", type: "number", min: 0, step: 1, value: user ? user.quota : 0 });
    const role = h("select", { class: "select" }, h("option", { value: 1 }, "普通用户"), h("option", { value: 10 }, "管理员"));
    role.value = String(user ? Math.min(user.role, 10) : 1);
    const canRole = me.role === ROLE.ROOT && (!user || (user.id !== me.id && user.role < ROLE.ROOT));
    const quickAdd = (n) => h("button", { class: "btn sm", type: "button", onclick: () => { quota.value = (Number(quota.value) || 0) + n; } }, `+${num(n)}`);
    modal(user ? "编辑用户" : "添加用户", h("div", { class: "form" },
      field("用户名", username),
      field("密码", password, user ? null : "8–64 位"),
      canRole ? field("角色", role) : null,
      field("积分", quota),
      h("div", { class: "toolbar" }, quickAdd(100), quickAdd(1000), quickAdd(10000))), {
      onOk: async () => {
        const body = { quota: Number(quota.value) || 0 };
        if (password.value) body.password = password.value;
        if (canRole) body.role = Number(role.value);
        if (user) await api("PUT", `/api/admin/user/${user.id}`, body);
        else await api("POST", "/api/admin/user", { ...body, username: username.value.trim(), password: password.value });
        toast(user ? "已保存" : "已创建");
        await onSaved();
      },
    });
  }
  async function pageUsers(root) {
    const keyword = h("input", { class: "input", placeholder: "搜索用户名" });
    const card = h("div", { class: "card" });
    let reload;
    root.append(pageHeader("用户管理", keyword, h("button", { class: "btn primary", type: "button", onclick: () => userModal(null, () => reload(1)) }, icon("plus"), "添加用户")), card);
    const canManage = (u) => u.id === me.id || me.role > u.role;
    reload = listView(card, (p) => api("GET", `/api/admin/user?p=${p}&size=${PAGE_SIZE}&keyword=${encodeURIComponent(keyword.value.trim())}`), [
      { title: "ID", render: (u) => u.id },
      { title: "用户名", render: (u) => u.username },
      { title: "GitHub", render: (u) => u.github_login || "—" },
      { title: "LINUX DO", render: (u) => u.linuxdo_login || "—" },
      { title: "角色", render: (u) => { const [n, c] = ROLE_TAG[u.role] || ["用户", ""]; return tag(n, c); } },
      { title: "状态", render: (u) => statusTag(u.status) },
      { title: "余额", num: true, render: (u) => num(u.quota) },
      { title: "已用", num: true, render: (u) => num(u.used_quota) },
      { title: "请求", num: true, render: (u) => num(u.request_count) },
      { title: "创建时间", render: (u) => fmtTime(u.created_at) },
      { title: "操作", render: (u) => (canManage(u) ? h("div", { class: "ops" },
        h("button", { class: "btn link", type: "button", onclick: () => userModal(u, () => reload()) }, "编辑"),
        u.role < ROLE.ROOT && u.id !== me.id ? h("button", { class: "btn link", type: "button", onclick: async () => { try { await api("PUT", `/api/admin/user/${u.id}`, { status: u.status === 1 ? 2 : 1 }); await reload(); } catch (e) { toast(e.message, true); } } }, u.status === 1 ? "禁用" : "启用") : null,
        u.role < ROLE.ROOT && u.id !== me.id ? h("button", { class: "btn link danger", type: "button", onclick: () => confirmModal("删除用户", `删除「${u.username}」及其全部令牌?`, async () => { await api("DELETE", `/api/admin/user/${u.id}`); toast("已删除"); await reload(); }) }, "删除") : null) : "—") },
    ]);
    keyword.addEventListener("input", () => reload(1).catch((e) => toast(e.message, true)));
    await reload(1);
  }

  // ---------------------------------------------------------------- 兑换码
  function redemptionModal(onSaved) {
    const name = h("input", { class: "input", maxlength: 20 });
    const quota = h("input", { class: "input", type: "number", min: 1, step: 1, value: 1000 });
    const count = h("input", { class: "input", type: "number", min: 1, max: 100, step: 1, value: 1 });
    modal("添加兑换码", h("div", { class: "form" }, field("名称", name), field("积分", quota), field("数量", count, "1–100")), {
      onOk: async () => {
        const keys = await api("POST", "/api/admin/redemption", { name: name.value.trim(), quota: Number(quota.value), count: Number(count.value) });
        await onSaved();
        const text = keys.join("\n");
        modal("兑换码", h("div", { class: "form" }, h("textarea", { class: "input mono", rows: Math.min(10, keys.length + 1), readonly: true }, text)), {
          okText: "复制全部", onOk: () => copyText(text),
        });
      },
    });
  }
  async function pageRedemptions(root) {
    const keyword = h("input", { class: "input", placeholder: "搜索名称" });
    const card = h("div", { class: "card" });
    let reload;
    root.append(pageHeader("兑换码", keyword, h("button", { class: "btn primary", type: "button", onclick: () => redemptionModal(() => reload(1)) }, icon("plus"), "添加兑换码")), card);
    reload = listView(card, (p) => api("GET", `/api/admin/redemption?p=${p}&size=${PAGE_SIZE}&keyword=${encodeURIComponent(keyword.value.trim())}`), [
      { title: "ID", render: (r) => r.id },
      { title: "名称", render: (r) => r.name },
      { title: "状态", render: (r) => { const [n, c] = REDEEM_STATUS[r.status] || ["未知", ""]; return tag(n, c); } },
      { title: "积分", num: true, render: (r) => num(r.quota) },
      { title: "创建时间", render: (r) => fmtTime(r.created_at) },
      { title: "兑换人", render: (r) => r.used_by_name || "—" },
      { title: "兑换时间", render: (r) => fmtTime(r.redeemed_at) },
      { title: "操作", render: (r) => h("div", { class: "ops" },
        h("button", { class: "btn link", type: "button", onclick: () => copyText(r.key) }, "复制"),
        r.status !== 3 ? h("button", { class: "btn link", type: "button", onclick: async () => { try { await api("PUT", `/api/admin/redemption/${r.id}`, { status: r.status === 1 ? 2 : 1 }); await reload(); } catch (e) { toast(e.message, true); } } }, r.status === 1 ? "禁用" : "启用") : null,
        h("button", { class: "btn link danger", type: "button", onclick: () => confirmModal("删除兑换码", `删除「${r.name}」?`, async () => { await api("DELETE", `/api/admin/redemption/${r.id}`); toast("已删除"); await reload(); }) }, "删除")) },
    ]);
    keyword.addEventListener("input", () => reload(1).catch((e) => toast(e.message, true)));
    await reload(1);
  }

  // ---------------------------------------------------------------- 系统设置
  // 第三方登录设置卡片:启用、Client ID、Client Secret(只写)、回调地址
  function oauthCard(o, key, hint) {
    const name = OAUTH_NAMES[key];
    const on = switchInput(o[`${key}_oauth_enabled`] === "true");
    const id = h("input", { class: "input mono", value: o[`${key}_client_id`], autocomplete: "off" });
    const secret = h("input", { class: "input mono", type: "password", autocomplete: "new-password", placeholder: o[`${key}_client_secret_set`] ? "已设置，留空不修改" : "" });
    const callback = `${location.origin}/api/oauth/${key}/callback`;
    const save = h("button", { class: "btn primary", type: "submit" }, "保存");
    return h("div", { class: "card" }, h("div", { class: "card-hd" }, h("h3", {}, `${name} 登录`)),
      h("form", { class: "card-bd form", onsubmit: async (e) => {
        e.preventDefault();
        save.disabled = true;
        try {
          const saved = await api("PUT", "/api/admin/option", {
            [`${key}_oauth_enabled`]: on.input.checked, [`${key}_client_id`]: id.value.trim(), [`${key}_client_secret`]: secret.value,
          });
          secret.value = "";
          secret.placeholder = saved[`${key}_client_secret_set`] ? "已设置，留空不修改" : "";
          sys[`${key}_oauth`] = saved[`${key}_oauth_enabled`] === "true" && Boolean(saved[`${key}_client_id`]) && saved[`${key}_client_secret_set`];
          toast("已保存");
        } catch (err) { toast(err.message, true); } finally { save.disabled = false; }
      } },
      h("div", { class: "field-row" }, "启用", on.el),
      field("Client ID", id),
      field("Client Secret", secret),
      h("div", { class: "field" }, "回调地址",
        h("span", { class: "key-cell" }, h("span", { class: "mono t2" }, callback),
          h("button", { class: "btn icon", type: "button", title: "复制", onclick: () => copyText(callback) }, icon("copy"))),
        h("span", { class: "hint" }, hint)),
      save));
  }

  async function pageSettings(root) {
    const o = await api("GET", "/api/admin/option");
    const name = h("input", { class: "input", value: o.system_name, maxlength: 30 });
    const price = h("input", { class: "input", type: "number", min: 0, step: 1, value: o.price_turnstile });
    const priceV1 = h("input", { class: "input", type: "number", min: 0, step: 1, value: o.price_v1 });
    const gift = h("input", { class: "input", type: "number", min: 0, step: 1, value: o.new_user_quota });
    const REGISTER_METHODS = [["password", "密码"], ["github", "GitHub"], ["linuxdo", "LINUX DO"]];
    const reg = Object.fromEntries(REGISTER_METHODS.map(([key]) => [key, switchInput(o[`register_${key}_enabled`] === "true")]));
    const v1On = switchInput(o.v1_enabled === "true");
    const oauthOnlyOn = switchInput(o.oauth_only_enabled === "true");
    const cfToken = h("input", { class: "input mono", type: "password", autocomplete: "new-password", placeholder: o.cf_api_token_set ? "已设置，留空不修改" : "" });
    const saveCf = h("button", { class: "btn primary", type: "submit" }, "保存");
    const save = h("button", { class: "btn primary", type: "submit" }, "保存");
    root.append(pageHeader("系统设置"), h("div", { class: "two" },
      h("div", { class: "stack" }, h("div", { class: "card" },
        h("div", { class: "card-hd" }, h("h3", {}, "基础")),
        h("form", { class: "card-bd form", onsubmit: async (e) => {
          e.preventDefault();
          save.disabled = true;
          try {
            const saved = await api("PUT", "/api/admin/option", {
              system_name: name.value.trim(), price_turnstile: Number(price.value), price_v1: Number(priceV1.value),
              new_user_quota: Number(gift.value), v1_enabled: v1On.input.checked, oauth_only_enabled: oauthOnlyOn.input.checked,
              ...Object.fromEntries(REGISTER_METHODS.map(([key]) => [`register_${key}_enabled`, reg[key].input.checked])),
            });
            sys.system_name = saved.system_name;
            sys.price_turnstile = Number(saved.price_turnstile);
            sys.oauth_only = saved.oauth_only_enabled === "true" && Boolean(sys.github_oauth || sys.linuxdo_oauth);
            sys.password_register = saved.register_password_enabled === "true" && !sys.oauth_only;
            sys.v1_enabled = saved.v1_enabled === "true";
            setSystemName(saved.system_name);
            toast("已保存");
          } catch (err) { toast(err.message, true); } finally { save.disabled = false; }
        } },
        field("系统名称", name),
        field("求解价格", price, "积分 / 次，成功才扣"),
        h("div", { class: "field-row" }, h("span", {}, "5 秒盾(/v1)", h("div", { class: "hint" }, "关闭后用户令牌不能调用 /v1，现有 API Key 不受影响")), v1On.el),
        field("5 秒盾价格", priceV1, "积分 / 次，成功才扣"),
        h("div", { class: "field" }, "开放注册",
          h("div", { class: "toggles" }, REGISTER_METHODS.map(([key, label]) => h("span", {}, label, reg[key].el))),
          h("span", { class: "hint" }, "关闭的方式不能注册新账号，已有账号仍可登录；GitHub 和 LINUX DO 还需在各自的登录设置中启用")),
        h("div", { class: "field-row" }, h("span", {}, "仅第三方登录",
          h("div", { class: "hint" }, "登录页只显示 GitHub / LINUX DO 按钮，关闭密码登录和密码注册；开启前先在个人设置中绑定")), oauthOnlyOn.el),
        field("新用户赠送", gift, "积分"),
        save)),
        h("div", { class: "card" }, h("div", { class: "card-hd" }, h("h3", {}, "服务器渠道")),
          h("form", { class: "card-bd form", onsubmit: async (e) => {
            e.preventDefault();
            saveCf.disabled = true;
            try {
              const saved = await api("PUT", "/api/admin/option", { cf_api_token: cfToken.value });
              cfToken.value = "";
              cfToken.placeholder = saved.cf_api_token_set ? "已设置，留空不修改" : "";
              toast("已保存");
            } catch (err) { toast(err.message, true); } finally { saveCf.disabled = false; }
          } },
          field("Cloudflare API Token", cfToken,
            "用于给服务器自动创建隧道和域名。在 dash.cloudflare.com → 我的个人资料 → API 令牌 创建，权限：账户 · Cloudflare Tunnel · 编辑;区域 · DNS · 编辑;区域 · 区域 · 读取(区域选 000.moe)"),
          saveCf))),
      h("div", { class: "stack" },
        oauthCard(o, "github", "在 GitHub → Settings → Developer settings → OAuth Apps 创建应用，回调地址填上面这个；开放 GitHub 注册时首次登录自动创建账号"),
        oauthCard(o, "linuxdo", "在 connect.linux.do → 应用接入 → 申请接入创建应用，回调地址填上面这个，最低等级在那里设置；开放 LINUX DO 注册时首次登录自动创建账号"))));
  }

  // ---------------------------------------------------------------- 启动
  async function boot() {
    applyTheme();
    if (location.hash.startsWith("#oauth_error=")) {
      const message = decodeURIComponent(location.hash.slice("#oauth_error=".length));
      history.replaceState(null, "", location.pathname);
      setTimeout(() => toast(message, true), 300);
    }
    try {
      sys = await api("GET", "/api/status");
      setSystemName(sys.system_name);
    } catch (err) {
      $("auth").hidden = false;
      $("auth-title").textContent = err.message;
      $("auth-form").hidden = true;
      return;
    }
    if (sys.setup_required) return showAuth();
    try {
      me = await api("GET", "/api/user/self");
      enterApp();
    } catch {
      if (location.hash === "#docs") showPublicDocs();
      else showAuth();
    }
  }
  boot();
})();
</script>
