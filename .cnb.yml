# FlareSolverr fleet on CNB
#   * 定时任务每 5 分钟运行一次轮换器,按负载在 a、b、c、d 四个位置中启用 2–4 个 worker,并在平台回收前完成新旧交替;
#     solver.000.moe 的 Worker 发现所有 worker 都繁忙时会立即触发一次轮换器扩容;
#   * worker 是「仅预览模式」的云原生开发环境,由轮换器通过 api_trigger_worker(_b/_c/_d) 创建;
#     位置 a 接入隧道 A(solver.000.moe),位置 x 接入隧道 X(solver-x.000.moe),
#     solver.000.moe 前面的 Cloudflare Worker 在各条隧道之间分流(deploy/cf-worker.js)。
# 密钥放在密钥仓库 AzusaMoe/secrets 中,见 deploy/README.md。

.rotate: &rotate
  name: rotate
  runner:
    cpus: 1
  docker:
    image: python:3.12-slim
  imports:
    - https://cnb.cool/AzusaMoe/secrets/-/blob/main/turnstile-rotator.yml
    # 读取负载需要 TS_API_KEY
    - https://cnb.cool/AzusaMoe/secrets/-/blob/main/turnstile-worker.yml
  env:
    FLEET_SLOTS: "a,b,c,d"
    FLEET_TARGET: "4"
    # 自动扩缩容范围:负载超过容量 70% 扩容,30 分钟内低于少一台后容量的 35% 缩容一台
    FLEET_MIN: "2"
    FLEET_MAX: "4"
    # 上线新版本时把这个数字加一并推送,轮换器会按错开规则逐个替换旧版本 worker
    FLEET_VERSION: "12"
    # 账号最多同时运行 6 个 CPU 开发环境(含其他仓库与自检环境),超出会被平台拒绝
    FLEET_MAX_WORKSPACES: "6"
  stages:
    - name: reconcile
      script: python -m fleet.rotator reconcile

# 每次求解 / FlareSolverr 请求都会启动一个浏览器,每个会话常驻一个浏览器。
# 实测 4 核 8GB、并发 10:40 个任务全部成功、0 次重试,CPU 约 55–75%,内存峰值约 5.5GB
.worker_env: &worker_env
  TS_MAX_CONCURRENCY: "10"
  TS_MAX_QUEUE: "10"
  # /solve 与任务:单次尝试超过 35 秒换新浏览器重试
  TS_ATTEMPT_TIMEOUT: "35"
  TS_TASK_TTL: "300"
  TS_MAX_PENDING_TASKS: "60"
  # 复选框出现前 20 秒没有进展才换浏览器(高并发时挑战计算变慢)
  TS_STALL_SECONDS: "20"
  # 低于 Cloudflare 100 秒的源站超时
  TS_MAX_TIMEOUT: "85"
  TS_MAX_SESSIONS: "4"
  TS_SESSION_IDLE_TTL: "1800"
  # FlareSolverr 的 waitress 线程数,需大于并发数,留给 /health、sessions.list 等轻量请求
  WAITRESS_THREADS: "14"

.worker: &worker
  runner:
    cpus: 4
  docker:
    build: .ide/Dockerfile
  imports:
    - https://cnb.cool/AzusaMoe/secrets/-/blob/main/turnstile-worker.yml
  services:
    - name: vscode
      options:
        onlyPreview: true
        launch: bash .ide/launch.sh
        # 隧道流量不经过平台代理,不计入保活检测;设为与最长保持时间一致
        keepAliveTimeout: 18h
  stages:
    # 名称被轮换器用来判断 worker 是否就绪,修改时同步 fleet/rotator.py 的 READY_STAGE
    - name: start-worker
      script: bash .ide/start-worker.sh
  endStages:
    - name: drain
      script: python -m fleet.agent drain || true

main:
  "crontab: */5 * * * *":
    - <<: *rotate

  # 手动触发一次轮换:POST /{repo}/-/build/start  {"event": "api_trigger_rotate"}
  api_trigger_rotate:
    - <<: *rotate

  api_trigger_worker:
    - <<: *worker
      name: worker-a
      env:
        <<: *worker_env
        FLEET_SLOT: a

  api_trigger_worker_b:
    - <<: *worker
      name: worker-b
      env:
        <<: *worker_env
        FLEET_SLOT: b

  api_trigger_worker_c:
    - <<: *worker
      name: worker-c
      env:
        <<: *worker_env
        FLEET_SLOT: c

  api_trigger_worker_d:
    - <<: *worker
      name: worker-d
      env:
        <<: *worker_env
        FLEET_SLOT: d

  # 端到端测试:solver 求解真实测试站点(testsite/)的 Turnstile,再由站点后端 siteverify 校验
  # POST /{repo}/-/build/start  {"event": "api_trigger_e2e", "env": {"E2E_ROUNDS": "1,8,24"}}
  api_trigger_e2e:
    - name: e2e
      runner:
        cpus: 2
      docker:
        image: python:3.12-slim
      imports:
        - https://cnb.cool/AzusaMoe/secrets/-/blob/main/turnstile-rotator.yml
        - https://cnb.cool/AzusaMoe/secrets/-/blob/main/turnstile-worker.yml
      stages:
        - name: e2e
          script: python examples/e2e_real_site.py

  # 诊断:不接隧道启动一个 worker,验证镜像、FlareSolverr、出口网络与环境保活;不受轮换器管理,用完需手动关闭
  api_trigger_selftest:
    - name: selftest
      runner:
        cpus: 2
      docker:
        build: .ide/Dockerfile
      env:
        AGENT_DISABLE_TUNNEL: "1"
        TS_MAX_CONCURRENCY: "2"
        WAITRESS_THREADS: "4"
      services:
        - name: vscode
          options:
            onlyPreview: true
            launch: bash .ide/launch.sh
            keepAliveTimeout: 18h
      stages:
        - name: start-worker
          script: bash .ide/start-worker.sh
