# 构建服务器渠道镜像并推送到 ghcr.io/tomorrowx6/solver(amd64 + arm64)
name: image

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "fleet/**"
      - "run.py"
      - "requirements.txt"
      - ".ide/Dockerfile"
      - "deploy/server/**"
      - "docker-bake.hcl"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/bake-action@v5
        env:
          SHA: ${{ github.sha }}
        with:
          files: docker-bake.hcl
          push: true
